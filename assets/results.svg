<style>.t{font:700 22px "Segoe UI",Inter,system-ui,sans-serif;fill:#eef1f8}.l{font:500 15px ui-monospace,Menlo,Consolas,monospace;fill:#9aa3bd}.v{font:700 18px ui-monospace,Menlo,Consolas,monospace}.bar{transform-box:fill-box;transform-origin:left;animation:grow 1.4s cubic-bezier(.22,1,.36,1) both}@keyframes grow{from{transform:scaleX(0)}}.v{animation:f 1s ease both}@keyframes f{from{opacity:0}}</style>
