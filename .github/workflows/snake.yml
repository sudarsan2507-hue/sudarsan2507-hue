name: Generate Snake
on:
  schedule: [{cron: "0 0 * * *"}]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions: {contents: write}
    steps:
      - uses: Platane/snk@v3
        id: snake
        with:
          github_user_name: sudarsan2507-hue
          outputs: |
            dist/snake.svg?color_snake=#f97316&color_dots=#ede9fe,#c4b5fd,#a78bfa,#7c3aed,#4c1d95
            dist/snake-dark.svg?color_snake=#f97316&color_dots=#161b22,#312e81,#4c1d95,#7c3aed,#a78bfa
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
